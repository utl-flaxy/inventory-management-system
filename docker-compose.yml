services:

  db:
    image: mariadb:12.2
    restart: unless-stopped

    container_name: inventory-db

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/db-init/01-app-privileges.sh:/docker-entrypoint-initdb.d/01-app-privileges.sh:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: inventory-management-system-app:${APP_IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    # Required: choose the app budget only after confirming actual host + DB capacity.
    mem_limit: ${APP_MEMORY_LIMIT:?APP_MEMORY_LIMIT must be selected for the verified host}
    memswap_limit: ${APP_MEMORY_LIMIT:?APP_MEMORY_LIMIT must be selected for the verified host}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777

    container_name: inventory-app

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DB_NAME:?DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Empty is safe: ignore proxy headers until the actual Docker transport peer is verified.
      APP_LOGIN_RATE_LIMIT_TRUSTED_PROXIES: ${LOGIN_TRUSTED_PROXIES:-}

volumes:
  mariadb_data:
