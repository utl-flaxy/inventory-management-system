# =========================
# MariaDB
# =========================
# 接続情報はSPRING_DATASOURCE_URL/USERNAME/PASSWORDで外部から渡す。固定fallbackなし。

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 公開ページAPIの大量fetchを制限する。profile共通で適用する。
spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:inventory-management-system}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
