springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Bounded admission/waits for one instance; keep the existing pool capacity, not a load/SLA claim.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5
spring.transaction.default-timeout=10s
# Tomcat drains existing requests; Compose allows a further 5 seconds for process/resource cleanup.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Public traffic reaches the app only through the host loopback Caddy proxy.
server.forward-headers-strategy=framework
# No shared Docker-peer fallback: an operator must verify exact proxy peers before production startup.
app.login.rate-limit.require-trusted-proxy=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# main portの標準probe。DB障害はtrafficを止めるが、applicationの再起動理由にしない。
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# stdoutへ出力し、MDC/request eventをJSON fieldとして保持する。
logging.structured.format.console=logstash

# DBのduplicate-key診断にはusername/key/constraintを含む。prodでは安全なapplication eventで診断する。
logging.level.org.mariadb.jdbc.message.server.ErrorPacket=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
# Hibernate 7 moved SQL exception diagnostics; retain the existing safe application-event contract.
logging.level.org.hibernate.orm.jdbc.error=OFF
# Flyway's INFO connection banner includes the URL; retain WARN compatibility diagnostics.
logging.level.org.flywaydb.core.FlywayExecutor=WARN
