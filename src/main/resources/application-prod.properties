springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# main portの標準probe。DB障害はtrafficを止めるが、applicationの再起動理由にしない。
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# stdoutへ出力し、MDC/request eventをJSON fieldとして保持する。
logging.structured.format.console=logstash

# DBのduplicate-key診断にはusername/key/constraintを含む。prodでは安全なapplication eventで診断する。
logging.level.org.mariadb.jdbc.message.server.ErrorPacket=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
