name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      # Issue #86 uses stacked dependency-family PRs; run the same gates on each base.
      - security/issue-86-*

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Verify (Surefire + Failsafe, including MariaDB)
        run: ./mvnw verify

      - name: Clean-source Docker build, non-root API, rollback and image audit
        run: python3 scripts/docker/verify_image.py --scan

      - name: Preserve value-free Docker validation and image audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/docker-validation/
          if-no-files-found: warn
          retention-days: 30

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Terraform initialize (no backend or AWS credentials)
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform mocked host contracts (no AWS operations)
        working-directory: terraform
        run: terraform test -no-color

      - name: Isolated backend/bootstrap contracts and negative mutations (no AWS operations)
        run: python3 scripts/ci/terraform_offline.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate policy regression tests
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Install reviewed Gitleaks binary
        run: python3 scripts/ci/quality_gates.py download gitleaks --output target/quality-gates/gitleaks
      - name: Real scanner failure regression
        run: python3 scripts/ci/quality_gates.py secret-self-test --scanner target/quality-gates/gitleaks
      - name: Scan every tracked file
        run: python3 scripts/ci/quality_gates.py secrets --scanner target/quality-gates/gitleaks
      - name: Preserve value-free secret findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/quality-gates/secrets.json
          if-no-files-found: warn
          retention-days: 30

  java-static-analysis:
    name: java-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Grant execute permission
        run: chmod +x mvnw
      - name: Real static scanner failure regression
        run: python3 scripts/ci/quality_gates.py static-self-test
      - name: Security category static analysis
        run: python3 scripts/ci/quality_gates.py static
      - name: Preserve static analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-static-analysis-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/quality-gates/static.json
            target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Grant execute permission
        run: chmod +x mvnw
      - name: Install reviewed OSV Scanner binary
        run: python3 scripts/ci/quality_gates.py download osv --output target/quality-gates/osv-scanner
      - name: Resolve production and test dependencies
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DincludeTestScope=true -DincludeProvidedScope=true -DincludeSystemScope=true
          -DoutputFormat=json -DoutputName=bom -Dcyclonedx.skipAttach=true
      - name: Audit dependencies (findings reported, operational errors fail)
        run: python3 scripts/ci/quality_gates.py dependencies --scanner target/quality-gates/osv-scanner
      - name: Preserve unsuppressed dependency audit and resolved SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/bom.json
            target/quality-gates/dependency-audit.json
            target/quality-gates/dependency-summary.json
          if-no-files-found: warn
          retention-days: 30
